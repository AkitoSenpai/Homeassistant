# ============================================================================
# /etc/systemd/system/ollama.service.d/override.conf
# ============================================================================
# Ce fichier est créé automatiquement par install-server.sh
# Il sert à exposer Ollama sur le réseau et à optimiser pour ton hardware.
# ============================================================================

[Service]
# Écouter sur toutes les interfaces (LAN)
Environment="OLLAMA_HOST=0.0.0.0:11434"

# Garder le modèle en RAM 10 minutes après le dernier usage
# (évite de recharger à chaque question)
Environment="OLLAMA_KEEP_ALIVE=10m"

# Nombre de requêtes parallèles (1 = économe en RAM, idéal pour ton setup)
Environment="OLLAMA_NUM_PARALLEL=1"

# Nombre de modèles chargés simultanément
# (1 par défaut, suffisant et préserve la RAM)
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# Force le mode CPU (ta GTX 660 n'est pas supportée par CUDA moderne)
Environment="OLLAMA_CPU=true"

# Logs verbeux si besoin de débugger (à enlever sinon)
# Environment="OLLAMA_DEBUG=1"
