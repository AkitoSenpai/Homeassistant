# ============================================================================
# SearXNG — settings.yml
# Copier vers /opt/searxng/settings.yml sur le serveur
# ============================================================================

use_default_settings: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  # IMPORTANT : changer ce secret en production !
  # Tu peux en générer un avec : openssl rand -hex 32
  secret_key: "CHANGE-ME-IN-PROD"
  limiter: false
  image_proxy: false
  # Mets ton domaine si tu en as un (sinon laisse vide)
  # base_url: https://search.example.com

ui:
  static_use_hash: true
  # Désactiver le formulaire HTML si tu n'utilises SearXNG que via l'API
  # (l'agent conversationnel n'utilise que l'API JSON)
  # default_theme: simple

search:
  formats:
    - json
    - csv
    - rss
  default_lang: "fr"
  safesearch: 0
  autocomplete: ""
  favicon_resolver: ""

# ============================================================================
# Moteurs de recherche activés
# - On en prend plusieurs pour la redondance
# - Tu peux en ajouter/retirer selon tes préférences
# ============================================================================
engines:
  - name: duckduckgo
    disabled: false
    timeout: 5.0
    shortcut: ddg
    tokens: []

  - name: wikipedia
    disabled: false
    shortcut: wp
    timeout: 5.0

  - name: qwant
    disabled: false
    shortcut: qw
    timeout: 5.0

  - name: brave
    disabled: false
    shortcut: br
    timeout: 5.0

  - name: startpage
    disabled: false
    shortcut: sp
    timeout: 5.0

  - name: mojeek
    disabled: false
    shortcut: mj
    timeout: 5.0

  - name: arxiv
    disabled: false
    shortcut: arx
    timeout: 10.0

  - name: github
    disabled: false
    shortcut: gh
    timeout: 5.0

  - name: stackoverflow
    disabled: false
    shortcut: st
    timeout: 5.0

  - name: mdpi
    disabled: false
    shortcut: md
    timeout: 5.0

  - name: z-library
    disabled: false
    shortcut: zl
    timeout: 10.0

  - name: unsplash
    disabled: false
    shortcut: us
    timeout: 5.0

  - name: vimeo
    disabled: false
    shortcut: vm
    timeout: 5.0

  - name: youtube
    disabled: false
    shortcut: yt
    timeout: 5.0

# ============================================================================
# Plugins : indispensables pour la sortie JSON correcte
# ============================================================================
plugins:
  - plugin: https://github.com/searxng/searxng-plugins/raw/main/plugins/self_info.py
  - plugin: https://github.com/searxng/searxng-plugins/raw/main/plugins/tracker_token_remover.py

# ============================================================================
# Filtres divers (anti-tracking, etc.)
# ============================================================================
enabled_plugins:
  - 'Self Information'
  - 'Tracker Token Remover'

# Désactiver les moteurs peu fiables / lents
disabled_engines:
  - google          # Souvent bloqué / CAPTCHA
  - bing            # Idem
  - yahoo           # Idem
