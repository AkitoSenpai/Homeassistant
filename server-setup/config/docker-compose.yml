# ============================================================================
# docker-compose.yml — SearXNG
# Copier vers /opt/searxng/docker-compose.yml
# ============================================================================

version: "3.7"

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      # <port-hôte>:<port-conteneur>
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    # On peut ajouter un réseau spécifique pour isoler
    # networks:
    #   - searxng-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Limite de RAM pour SearXNG (très léger par défaut, juste pour la sécurité)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M

# networks:
#   searxng-net:
#     driver: bridge
