# ============================================================================
# Exemple de configuration pour Home Assistant
# ============================================================================
# Copier/ajuster dans votre configuration.yaml principal
# ============================================================================

# ---------- Intents conversationnels ----------
# Permet de tester l'agent via l'UI Développeur > Services
conversation:
  # Vous pouvez configurer l'agent via l'UI
  # Paramètres > Intégrations > Ajouter > "Gemma Local Assistant"

# ---------- Pipeline vocal (TTS + STT) ----------
# Configuration recommandée : tout en local et léger
# - STT : faster-whisper (tiny ou base, GPU optionnel)
# - TTS : piper (voix française onnx)

# Exemple avec Wyoming Protocol :
# (lancez d'abord les conteneurs/services piper + faster-whisper)
wyoming:
  - host: localhost
    port: 10300  # Piper TTS
  - host: localhost
    port: 10301  # Whisper STT

tts:
  - platform: wyoming
    host: localhost
    port: 10300

stt:
  - platform: wyoming
    host: localhost
    port: 10301

# ---------- Pipeline d'assistant vocal ----------
# Connecte STT -> conversation -> TTS
# Une fois créé, il apparaîtra dans Paramètres > Assistants vocaux
# et vous pourrez l'assigner à un satellite (ESPHome, etc.)
#
# Note : les pipelines se créent normalement via l'UI
# Paramètres > Assistants vocaux > Ajouter un assistant
# Voici la forme YAML équivalente à titre informatif :
#
# assist_pipeline:
#   - name: "Gemma Local"
#     conversation_engine: homeassistant
#     conversation_engine_language: fr
#     stt_engine: wyoming
#     stt_language: fr
#     tts_engine: wyoming
#     tts_language: fr
#     wake_word_entity: null  # ou votre wake word (porcupine, openwakeword)

# ---------- L'agent de conversation par défaut ----------
# (déclaré automatiquement par l'intégration gemma_assistant)
# Pour l'utiliser, allez dans Paramètres > Assistants vocaux
# et choisissez "Gemma Assistant" comme agent de conversation.

# ---------- Exemple : notification pour debug ----------
logger:
  default: info
  logs:
    custom_components.gemma_assistant: debug
